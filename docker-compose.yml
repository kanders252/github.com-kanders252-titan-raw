# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: titan_raw
    ports:
      - "5432:5432"
    volumes:
      - titan_raw_pg:/var/lib/postgresql/data
volumes:
  titan_raw_pg:
