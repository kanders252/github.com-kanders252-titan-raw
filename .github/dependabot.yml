version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # The stack is pinned by spec (Next 14, React 18, Tailwind 3, NextAuth 4, Prisma 5).
    # Major upgrades are deliberate migrations, not weekly bumps. Security fixes still
    # arrive via Dependabot security updates (repo Settings → Code security).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
